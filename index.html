<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Fetch API Catatan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="layout">

        <!-- ====== KIRI: aplikasi ====== -->
        <section class="app">
            <h1>Uji Fetch API Catatan</h1>
            <p class="muted">Halaman ini memanggil backend PHP lewat axios. Server: <code id="serverUrl"></code></p>

            <!-- Tampil kalau BELUM login -->
            <div id="loginPanel" class="panel">
                <h2>Masuk</h2>
                <form id="loginForm">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" required>

                    <button type="submit">Masuk</button>
                </form>
            </div>

            <!-- Tampil kalau SUDAH login -->
            <div id="notesPanel" class="panel" hidden>
                <div class="panel-head">
                    <h2>Halo, <span id="userName"></span></h2>
                    <button type="button" id="logoutButton" class="secondary">Keluar</button>
                </div>

                <form id="noteForm">
                    <label for="title">Judul</label>
                    <input type="text" id="title" maxlength="150" required>

                    <label for="content">Isi</label>
                    <textarea id="content" rows="3"></textarea>

                    <div class="row">
                        <button type="submit" id="saveButton">Simpan catatan</button>
                        <button type="button" id="cancelButton" class="secondary" hidden>Batal edit</button>
                    </div>
                </form>

                <ul id="noteList" class="notes"></ul>
            </div>

            <p id="message" role="status"></p>
        </section>

        <!-- ====== KANAN: log request/response ====== -->
        <aside class="log">
            <h2>Yang dikirim dan diterima</h2>
            <p class="muted">Setiap klik di kiri akan tercatat di sini, lengkap dengan method, status, dan JSON-nya.</p>
            <div id="logList"></div>
        </aside>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
